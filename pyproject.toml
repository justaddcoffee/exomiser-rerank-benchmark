[project]
name = "exomiser-rerank-benchmark"
version = "0.1.0"
description = "Does OpenScientist's evidence-based reranking improve on Exomiser's baseline gene ranking?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",        # OS REST API client + fetching phenopackets
    "pyyaml>=6",          # phenopacket / output parsing (YAML or JSON)
    "pandas>=2",          # results tables / per-case CSV
    "statsmodels>=0.14",  # McNemar's test for paired hits@k
    "python-dotenv>=1",   # load .env (OS_API_URL / OS_API_KEY)
]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
