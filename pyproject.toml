[project]
name = "exomiser-rerank-benchmark"
version = "0.1.0"
description = "Does OpenScientist's evidence-based reranking improve on Exomiser's baseline gene ranking?"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",        # OS REST API client
    "python-dotenv>=1",   # load .env (OS_API_URL / OS_API_KEY / OS_JOBS_DIR)
    "statsmodels>=0.14",  # McNemar's exact test for paired hits@k (pulls numpy/scipy)
]

[dependency-groups]
dev = ["ruff>=0.6"]
synth = [
    "phenotype2phenopacket>=0.6.18",
]

# Run-as-`python -m benchmark.X` script project: manage the venv/deps, don't build a wheel.
[tool.uv]
package = false
